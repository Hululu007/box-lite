apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.github.tvbox.osc.bbox'

    // v1.1.0 升级：compileSdk 30 → 35（AGP 8.13 / minSdk 21 / 安卓 5.0 起步）
    compileSdk 35

    defaultConfig {
        // 64 位共存版：独立包名，可与 32 位版（tv.of.eu.box.daily）同机共存
        // versionCode 序列承接 bl1026-64（1.0.26=28）→ 29；versionName 与 32 位新服同步 1.1.3（NodeJS 内置版）
        applicationId 'tv.of.eu.box.daily.arm64'
        minSdk 21
        targetSdk 26
        versionCode 39
        versionName '2.0.1'
        multiDexEnabled true
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        // P1：m3u8 原生过滤模块（app/src/main/jni → libm3u8native.so）
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    signingConfigs {
        // 签名配置在 local.properties（严禁提交仓库）
        release {
            def sp = new Properties()
            def lf = rootProject.file('local.properties')
            if (lf.exists()) sp.load(new FileInputStream(lf))
            storeFile sp.getProperty('box.storeFile') ? file(sp.getProperty('box.storeFile')) : null
            storePassword sp.getProperty('box.storePassword')
            keyAlias sp.getProperty('box.keyAlias')
            keyPassword sp.getProperty('box.keyPassword')
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'release') {
                output.outputFileName = "box-v${defaultConfig.versionName}-arm64.apk"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += 'META-INF/DEPENDENCIES'
        }
    }

    buildTypes {
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled false
            ndk { abiFilters 'arm64-v8a' }
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 关闭 R8 混淆/裁剪：proguard-rules.pro 为空，R8 会删掉 Room/Gson/quickjs 等反射用类，
            // 造成 release 启动即崩（debug 正常）。为保证可运行，release 暂不开启 minify。
            minifyEnabled false
            signingConfig signingConfigs.release
            // 64 位版：全部原生库（p2p/quickjs/ijk/player/node/chaquopy）均打包 arm64-v8a
            ndk { abiFilters 'arm64-v8a' }
        }
    }

    // 禁用 ABI 分割（保持单包）
    splits {
        abi { enable false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // catvod 用 Java 17 record，D8 对 minSdk 21 需 core library desugaring 才能生成 global synthetics
        coreLibraryDesugaringEnabled true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Python 3.10 嵌入运行时（chaquopy 16.1，双架构 armeabi-v7a/arm64-v8a 均支持）
chaquopy {
    defaultConfig {
        version = "3.10"
        // 构建期 Python（仅用于跑 pip，不上设备）
        // 注意：此路径为维护者机器路径，自建环境请改成本机 Python 3.8+ 解释器路径
        buildPython "C:/Users/Administrator/.local/share/TeleAgent/runtimes/python/python.exe"
        pip {
            // FongMi 运行时核心集。C 扩展（lxml/ujson/pycryptodome/cryptography）只有
            // android_24 wheel，故用 --platform 放行；纯 Python 包走清华镜像
            install "lxml==5.3.0"
            install "ujson==5.11.0"
            install "pycryptodome==3.21.0"
            install "cryptography==42.0.8"
            install "pyquery==2.1.0"
            install "requests==2.34.2"
            install "beautifulsoup4==4.15.0"
            install "yapf==0.43.0"
            install "pywasm==1.0.8"
            install "cachetools==7.2.1"
            options("--index-url", "https://pypi.tuna.tsinghua.edu.cn/simple",
                    "--extra-index-url", "https://pypi.org/simple",
                    // C 扩展 android 轮子已预下载到本地，由本机 8765 端口 HTTP 扁平索引提供：
                    // ① chaquo.com 下载仅 ~13-34KB/s，构建期 pip 会超时；
                    // ② chaquopy 内置 pip 20.1 在 Python 3.12 下本地路径 find-links 失效（"not a file"），HTTP URL 正常。
                    // numpy 为 android_21 标签（匹配 chaquopy 自动平台标签）
                    "--find-links", "http://127.0.0.1:8765/",
                    // 平台标签必须全下划线（pip 20.1 单值覆盖：此值最终生效）：
                    // 带连字符的 arm64-v8a 会原样进标签集，与轮子的 arm64_v8a 不匹配（arm32 的 armeabi_v7a 天然无连字符故从未踩坑）
                    "--platform", "android_24_arm64_v8a",
                    // 强制 C 扩展走轮子：否则 pip 会优先选更高版本源码包（如 cffi 2.1.1），元数据阶段需宿主 MSVC → 失败
                    "--only-binary", "cffi,cryptography,lxml,ujson,pycryptodome,numpy",
                    "--disable-pip-version-check")
        }
    }
    sourceSets {
        main {
            srcDir "src/main/python"
        }
    }
}

dependencies {
    api fileTree(dir: "libs", include: ["*.jar", "*.aar"])

    // Java 17 record 脱糖（配合 catvod）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'

    implementation 'com.github.alidili:FlowLayout:v1.5'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.3.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    annotationProcessor 'androidx.room:room-compiler:2.3.0'
    implementation 'androidx.room:room-runtime:2.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.okio:okio:3.6.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.45-androidx'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'me.jessyan:autosize:1.2.1'
    implementation('com.thoughtworks.xstream:xstream:1.4.15') { exclude group: 'xmlpull', module: 'xmlpull' }
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.orhanobut:hawk:2.0.1'

    implementation project(":player")
    implementation project(":quickjs")
    implementation project(":catvod")
    implementation project(":chaquo")
    implementation project(":nodejs")

    implementation 'com.lzy.net:okgo:3.0.4'
    implementation 'com.owen:tv-recyclerview:3.0.0'
    implementation 'com.github.getActivity:XXPermissions:13.6'
    implementation 'org.jsoup:jsoup:1.14.1'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
    implementation 'org.brotli:dec:0.1.2'
}
