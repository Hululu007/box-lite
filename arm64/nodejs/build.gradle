plugins {
    id 'com.android.library'
}

android {
    namespace 'com.fongmi.nodejs'

    compileSdk 35

    // NDK 27.0.12077973 用于编译 nodebridge（16KB 页对齐）；本机 C:\bl-build\sdk\ndk 已装
    ndkVersion '27.0.12077973'

    defaultConfig {
        minSdk 21
        targetSdk 26
        ndk {
            // 64 位版：仅 arm64（nodebridge 只编 arm64；v7a libnode 由过滤剔除不打包）
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        // FongMi 原用 21；AGP 8.5.2 上限 17 → 降为 17（switch 箭头/instanceof 模式匹配均支持）
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // 关闭 legacy 打包：libnode.so 按 nativeLibraryDir 正常解压加载
            useLegacyPackaging = false
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // FongMi 同款：catvod 以 api 暴露 okhttp/gson/okio/annotation，编译期可见，运行期由宿主提供
    compileOnly project(':catvod')
    // 必须 compileOnly：box app 内置 fi.iki.elonen.NanoHTTPD（org.nanohttpd:2.3.1），
    // 若用 implementation 会在 mergeDex 阶段重复类报错
    compileOnly 'org.nanohttpd:nanohttpd:2.3.1'
    compileOnly 'androidx.annotation:annotation:1.3.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}