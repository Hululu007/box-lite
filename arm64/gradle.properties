# Project-wide Gradle settings (AGP 8.13 / Gradle 8.13 / JDK 21)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# AndroidX
android.useAndroidX=true
android.enableJetifier=true
# jdk18on 系 bytecode 超出 Jetifier 的 ASM 解析能力，跳过重写（无需 androidx 化的纯 Java 库）
android.jetifier.ignorelist=org.bouncycastle:bcprov-jdk18on,org.bouncycastle:bcpkix-jdk18on
# 老代码兼容：保持传递 R 类与 final R 字段（AGP 8 默认均为 true，会破坏老式 R 引用/switch-case）
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# 构建配置
IsDebug=true
android.suppressUnsupportedCompileSdk=35
# D8 需要为 catvod 的 Java 17 record 生成 global synthetics（AGP 8.5 库 dex 消费端默认关）
android.enableGlobalSynthetics=true
